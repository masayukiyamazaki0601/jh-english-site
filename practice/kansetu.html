<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>間接疑問 練習問題</title><meta name="description" content="中学英語 間接疑問 の練習問題"><link rel="stylesheet" href="../css/style.css"></head><body><header class="header"><div class="header-inner"><a href="../index.html" class="header-logo">📚 中学英語<span>Lab</span></a><nav class="header-nav"><a href="../index.html">ホーム</a><a href="../index.html#grammar">文法解説</a><a href="../index.html#practice" class="active">練習問題</a><a href="../test/index.html">確認テスト</a></nav><div class="hamburger" onclick="document.getElementById('mobileNav').classList.toggle('open')"><span></span><span></span><span></span></div></div></header><div class="mobile-nav" id="mobileNav"><a href="../index.html">ホーム</a><a href="../index.html#grammar">文法解説</a><a href="../index.html#practice">練習問題</a><a href="../test/index.html">確認テスト</a></div><div class="breadcrumb"><a href="../index.html">ホーム</a> > <a href="index.html">練習問題</a> > 間接疑問</div><div class="page-header"><h1>間接疑問 練習問題</h1><p>全8問。</p></div><div class="container"><div class="practice-box" id="practiceApp"><div class="question-card" v-for="(q,i) in questions" :key="i"><div class="q-number">{{ i+1 }}</div><div class="q-text">{{ q.text }}</div><div class="q-options"><div v-for="opt in q.options" :key="opt" class="q-option" :class="{ correct: answered[i] && opt===q.answer, wrong: answered[i] && selected[i]===opt && opt!==q.answer }" @click="selectAnswer(i,opt)">{{ opt }}</div></div><div class="feedback" :class="{ show: answered[i], correct: answered[i] && selected[i]===q.answer, wrong: answered[i] && selected[i]!==q.answer }"><template v-if="answered[i] && selected[i]===q.answer">✅ {{ q.explanation }}</template><template v-else-if="answered[i]">❌ 正解は「{{ q.answer }}」 {{ q.explanation }}</template></div></div><div style="text-align:center;margin:24px 0;"><button class="hero-btn primary" @click="resetAll" style="border:none;cursor:pointer;">🔄 やり直す</button></div><div class="test-result" v-if="allAnswered"><div class="score">{{ score }} / 8</div><div class="rank">{{ score===questions.length ? '🎉 満点！' : score>=7 ? '👍 よくできました！' : '💪 もう一度！' }}</div></div></div></div><div class="ad-placeholder">広告スペース</div><footer class="footer"><div class="footer-inner"><div><h3>📚 中学英語Lab</h3></div></div><div class="footer-bottom">&copy; 2026 中学英語Lab</div></footer></body></html><script src="https://unpkg.com/vue@3/dist/vue.global.js"></script><script>const { createApp } = Vue;createApp({data(){return{selected:{},answered:{},questions:[{"text": "Do you know where he ( )?", "options": ["lives", "does live", "live"], "answer": "lives", "explanation": "間接疑問のあとは肯定文の語順"}, {"text": "I don''t know what this ( ).", "options": ["is", "does is", "it is"], "answer": "is", "explanation": "間接疑問のあとは肯定文の語順"}, {"text": "Can you tell me where the station ( )?", "options": ["is", "does be", "be"], "answer": "is", "explanation": "間接疑問のあとは肯定文の語順"}, {"text": "I wonder ( ) he is kind.", "options": ["if", "what", "where"], "answer": "if", "explanation": "「〜かどうか」は if/whether"}, {"text": "Do you know ( ) she will come?", "options": ["if", "what", "where"], "answer": "if", "explanation": "「〜かどうか」は if/whether"}, {"text": "Please tell me when the movie ( ).", "options": ["starts", "does start", "start"], "answer": "starts", "explanation": "間接疑問のあとは肯定文の語順"}, {"text": "I know ( ) she is.", "options": ["who", "what", "where"], "answer": "who", "explanation": "「誰か」を尋ねる疑問詞"}, {"text": "Do you know how much it ( )?", "options": ["costs", "does cost", "cost"], "answer": "costs", "explanation": "間接疑問のあとは肯定文の語順"}]}},computed:{allAnswered(){return this.questions.every((_,i)=>this.answered[i])},score(){return this.questions.filter((q,i)=>this.selected[i]===q.answer).length}},methods:{selectAnswer(i,opt){if(this.answered[i])return;this.selected[i]=opt;this.answered[i]=true},resetAll(){this.selected={};this.answered={}}}}).mount("#practiceApp");</script></body></html>
