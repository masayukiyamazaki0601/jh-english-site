<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>現在完了進行形 練習問題</title><meta name="description" content="中学英語 現在完了進行形 の練習問題"><link rel="stylesheet" href="../css/style.css"></head><body><header class="header"><div class="header-inner"><a href="../index.html" class="header-logo">📚 中学英語<span>Lab</span></a><nav class="header-nav"><a href="../index.html">ホーム</a><a href="../index.html#grammar">文法解説</a><a href="../index.html#practice" class="active">練習問題</a><a href="../test/index.html">確認テスト</a></nav><div class="hamburger" onclick="document.getElementById('mobileNav').classList.toggle('open')"><span></span><span></span><span></span></div></div></header><div class="mobile-nav" id="mobileNav"><a href="../index.html">ホーム</a><a href="../index.html#grammar">文法解説</a><a href="../index.html#practice">練習問題</a><a href="../test/index.html">確認テスト</a></div><div class="breadcrumb"><a href="../index.html">ホーム</a> > <a href="index.html">練習問題</a> > 現在完了進行形</div><div class="page-header"><h1>現在完了進行形 練習問題</h1><p>全8問。</p></div><div class="container"><div class="practice-box" id="practiceApp"><div class="question-card" v-for="(q,i) in questions" :key="i"><div class="q-number">{{ i+1 }}</div><div class="q-text">{{ q.text }}</div><div class="q-options"><div v-for="opt in q.options" :key="opt" class="q-option" :class="{ correct: answered[i] && opt===q.answer, wrong: answered[i] && selected[i]===opt && opt!==q.answer }" @click="selectAnswer(i,opt)">{{ opt }}</div></div><div class="feedback" :class="{ show: answered[i], correct: answered[i] && selected[i]===q.answer, wrong: answered[i] && selected[i]!==q.answer }"><template v-if="answered[i] && selected[i]===q.answer">✅ {{ q.explanation }}</template><template v-else-if="answered[i]">❌ 正解は「{{ q.answer }}」 {{ q.explanation }}</template></div></div><div style="text-align:center;margin:24px 0;"><button class="hero-btn primary" @click="resetAll" style="border:none;cursor:pointer;">🔄 やり直す</button></div><div class="test-result" v-if="allAnswered"><div class="score">{{ score }} / 8</div><div class="rank">{{ score===questions.length ? '🎉 満点！' : score>=7 ? '👍 よくできました！' : '💪 もう一度！' }}</div></div></div></div><div class="ad-placeholder">広告スペース</div><footer class="footer"><div class="footer-inner"><div><h3>📚 中学英語Lab</h3></div></div><div class="footer-bottom">&copy; 2026 中学英語Lab</div></footer></body></html><script src="https://unpkg.com/vue@3/dist/vue.global.js"></script><script>const { createApp } = Vue;createApp({data(){return{selected:{},answered:{},questions:[{"text": "I have been ( ) English for 3 years.", "options": ["study", "studied", "studying"], "answer": "studying", "explanation": "have + been + doing"}, {"text": "It has been ( ) since morning.", "options": ["rain", "rained", "raining"], "answer": "raining", "explanation": "have + been + doing"}, {"text": "How long have you been ( ) here?", "options": ["live", "lived", "living"], "answer": "living", "explanation": "have + been + doing"}, {"text": "She has been ( ) for 30 minutes.", "options": ["wait", "waited", "waiting"], "answer": "waiting", "explanation": "have + been + doing"}, {"text": "They have been ( ) tennis for 2 hours.", "options": ["play", "played", "playing"], "answer": "playing", "explanation": "have + been + doing"}, {"text": "I have not been ( ) well lately.", "options": ["sleep", "slept", "sleeping"], "answer": "sleeping", "explanation": "否定文でも be + doing"}, {"text": "Has it been ( ) since yesterday?", "options": ["rain", "rained", "raining"], "answer": "raining", "explanation": "疑問文でも be + doing"}, {"text": "He has been ( ) here since April.", "options": ["work", "worked", "working"], "answer": "working", "explanation": "have + been + doing"}]}},computed:{allAnswered(){return this.questions.every((_,i)=>this.answered[i])},score(){return this.questions.filter((q,i)=>this.selected[i]===q.answer).length}},methods:{selectAnswer(i,opt){if(this.answered[i])return;this.selected[i]=opt;this.answered[i]=true},resetAll(){this.selected={};this.answered={}}}}).mount("#practiceApp");</script></body></html>
