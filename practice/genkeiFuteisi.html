<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>原形不定詞 練習問題</title><meta name="description" content="中学英語 原形不定詞 の練習問題"><link rel="stylesheet" href="../css/style.css"></head><body><header class="header"><div class="header-inner"><a href="../index.html" class="header-logo">📚 中学英語<span>Lab</span></a><nav class="header-nav"><a href="../index.html">ホーム</a><a href="../index.html#grammar">文法解説</a><a href="../index.html#practice" class="active">練習問題</a><a href="../test/index.html">確認テスト</a></nav><div class="hamburger" onclick="document.getElementById('mobileNav').classList.toggle('open')"><span></span><span></span><span></span></div></div></header><div class="mobile-nav" id="mobileNav"><a href="../index.html">ホーム</a><a href="../index.html#grammar">文法解説</a><a href="../index.html#practice">練習問題</a><a href="../test/index.html">確認テスト</a></div><div class="breadcrumb"><a href="../index.html">ホーム</a> > <a href="index.html">練習問題</a> > 原形不定詞</div><div class="page-header"><h1>原形不定詞 練習問題</h1><p>全8問。</p></div><div class="container"><div class="practice-box" id="practiceApp"><div class="question-card" v-for="(q,i) in questions" :key="i"><div class="q-number">{{ i+1 }}</div><div class="q-text">{{ q.text }}</div><div class="q-options"><div v-for="opt in q.options" :key="opt" class="q-option" :class="{ correct: answered[i] && opt===q.answer, wrong: answered[i] && selected[i]===opt && opt!==q.answer }" @click="selectAnswer(i,opt)">{{ opt }}</div></div><div class="feedback" :class="{ show: answered[i], correct: answered[i] && selected[i]===q.answer, wrong: answered[i] && selected[i]!==q.answer }"><template v-if="answered[i] && selected[i]===q.answer">✅ {{ q.explanation }}</template><template v-else-if="answered[i]">❌ 正解は「{{ q.answer }}」 {{ q.explanation }}</template></div></div><div style="text-align:center;margin:24px 0;"><button class="hero-btn primary" @click="resetAll" style="border:none;cursor:pointer;">🔄 やり直す</button></div><div class="test-result" v-if="allAnswered"><div class="score">{{ score }} / 8</div><div class="rank">{{ score===questions.length ? '🎉 満点！' : score>=7 ? '👍 よくできました！' : '💪 もう一度！' }}</div></div></div></div><div class="ad-placeholder">広告スペース</div><footer class="footer"><div class="footer-inner"><div><h3>📚 中学英語Lab</h3></div></div><div class="footer-bottom">&copy; 2026 中学英語Lab</div></footer></body></html><script src="https://unpkg.com/vue@3/dist/vue.global.js"></script><script>const { createApp } = Vue;createApp({data(){return{selected:{},answered:{},questions:[{"text": "I saw him ( ) across the street.", "options": ["run", "to run", "running"], "answer": "run", "explanation": "知覚動詞のあとは原形不定詞"}, {"text": "She made me ( ) the room.", "options": ["clean", "to clean", "cleaning"], "answer": "clean", "explanation": "使役動詞のあとは原形"}, {"text": "Let''s ( ) to the park.", "options": ["go", "to go", "going"], "answer": "go", "explanation": "Let''s のあとは原形"}, {"text": "I heard her ( ) a beautiful song.", "options": ["sing", "to sing", "singing"], "answer": "sing", "explanation": "知覚動詞のあとは原形"}, {"text": "My father had me ( ) the car.", "options": ["wash", "to wash", "washing"], "answer": "wash", "explanation": "使役動詞のあとは原形"}, {"text": "We watched the sun ( ).", "options": ["set", "to set", "setting"], "answer": "set", "explanation": "知覚動詞のあとは原形"}, {"text": "He helped me ( ) the box.", "options": ["carry", "to carry", "carrying"], "answer": "carry", "explanation": "help のあとは原形でもto不定詞でも可"}, {"text": "She let me ( ) her phone.", "options": ["use", "to use", "using"], "answer": "use", "explanation": "let のあとは原形"}]}},computed:{allAnswered(){return this.questions.every((_,i)=>this.answered[i])},score(){return this.questions.filter((q,i)=>this.selected[i]===q.answer).length}},methods:{selectAnswer(i,opt){if(this.answered[i])return;this.selected[i]=opt;this.answered[i]=true},resetAll(){this.selected={};this.answered={}}}}).mount("#practiceApp");</script></body></html>
